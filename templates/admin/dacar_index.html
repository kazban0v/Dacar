{% extends "admin/index.html" %}
{% block content %}
{% if user.is_superuser %}
<div class="module" style="padding:18px 20px;margin-bottom:24px;border:1px solid var(--hairline-color);border-radius:10px">
    <h2 style="background:none;color:var(--body-fg);padding:0;margin:0 0 8px">Состояние сервера</h2>
    <p style="margin:0 0 12px;color:var(--body-quiet-color)">Процессор, память, диск и база данных. Только наблюдение.</p>
    <a href="{% url 'admin:server_monitor' %}" class="button" style="display:inline-block;padding:10px 16px">Открыть мониторинг →</a>
</div>
{% endif %}
{{ block.super }}
{% endblock %}
