<style>
.docs{max-width:1200px;margin:auto;padding:clamp(12px,3vw,32px);color:var(--text-main)}
.docs>a{display:inline-flex;margin-bottom:10px;color:var(--accent-cyan);font-weight:700;text-decoration:none}.docs>a:hover{text-decoration:underline}
.docs h1{font-size:clamp(24px,4vw,34px);margin:0 0 12px}.docs h2{margin:0 0 14px}.docs p{line-height:1.6}.docs .muted{color:var(--text-muted)}
.docs .panel{background:var(--card-bg,#fff);border:1px solid var(--card-border,#dce3ec);border-radius:16px;padding:clamp(14px,2vw,24px);margin:18px 0;min-width:0}
.docs .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.docs label{display:block;font-size:14px;font-weight:600;min-width:0}.docs input,.docs select{box-sizing:border-box;width:100%;max-width:100%;padding:10px;border:1px solid var(--input-border,#a8b6c7);border-radius:8px;background:var(--input-bg,var(--card-bg,#fff));color:var(--input-text,var(--text-main));font:inherit;margin-top:6px;min-width:0}.docs input::placeholder{color:var(--input-placeholder,var(--text-muted));opacity:1}.docs select option{background:var(--select-option-bg,var(--card-bg));color:var(--select-option-text,var(--text-main))}
.docs .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.docs .scroll{overflow-x:auto}.docs table{width:100%;border-collapse:collapse;font-size:14px}.docs th,.docs td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--card-border,#dce3ec);vertical-align:top}.docs td{overflow-wrap:anywhere}.docs .number{text-align:right;white-space:nowrap}.docs .errorlist,.docs .error{color:#dc2626}.docs .total{font-size:20px;font-weight:700;text-align:right}.docs .invoice-line{display:grid;grid-template-columns:minmax(160px,3fr) minmax(70px,1fr) minmax(80px,1fr) auto;gap:10px;margin-bottom:14px;align-items:end}.docs .invoice-line button{min-height:42px}.docs .note{padding:12px 16px;border-left:3px solid var(--accent-cyan);border-radius:6px;background:color-mix(in srgb,var(--accent-cyan) 8%,var(--card-bg));color:var(--text-main)}.docs .full{grid-column:1/-1}
.docs .week-shortcuts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.docs .week-shortcuts a{font-size:13px}.docs form>p{margin:0 0 14px}.docs form>p label{margin-bottom:6px}.docs form>p input{margin-top:0}
html[data-theme="dark"] .docs .errorlist,html[data-theme="dark"] .docs .error{color:#FCA5A5}
@media(max-width:640px){.docs .fields{grid-template-columns:1fr}.docs .invoice-line{grid-template-columns:1fr 1fr}.docs .invoice-line label:first-child{grid-column:1/-1}.docs .invoice-line button{grid-column:1/-1}.docs{padding:12px}.docs th,.docs td{padding:8px}}
</style>
