<style>
.docs{max-width:1200px;margin:auto;padding:clamp(12px,3vw,32px);color:var(--text-main)}
.docs h1{font-size:clamp(24px,4vw,34px);margin:0 0 12px}.docs p{line-height:1.6}.docs .muted{color:var(--text-muted)}
.docs .panel{background:var(--card-bg,#fff);border:1px solid var(--card-border,#dce3ec);border-radius:16px;padding:clamp(14px,2vw,24px);margin:18px 0;min-width:0}
.docs .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.docs label{display:block;font-size:14px;font-weight:600;min-width:0}.docs input,.docs select{box-sizing:border-box;width:100%;max-width:100%;padding:10px;border:1px solid #a8b6c7;border-radius:8px;background:var(--card-bg,#fff);color:inherit;font:inherit;margin-top:6px;min-width:0}
.docs .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.docs .scroll{overflow-x:auto}.docs table{width:100%;border-collapse:collapse;font-size:14px}.docs th,.docs td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--card-border,#dce3ec);vertical-align:top}.docs td{overflow-wrap:anywhere}.docs .number{text-align:right;white-space:nowrap}.docs .errorlist,.docs .error{color:#dc2626}.docs .total{font-size:20px;font-weight:700;text-align:right}.docs .invoice-line{display:grid;grid-template-columns:minmax(160px,3fr) minmax(70px,1fr) minmax(80px,1fr) auto;gap:10px;margin-bottom:14px;align-items:end}.docs .invoice-line button{min-height:42px}.docs .note{border-left:3px solid #0284c7;padding:12px 16px;background:var(--bg-body,#f1f5f9);border-radius:6px}.docs .full{grid-column:1/-1}
@media(max-width:640px){.docs .fields{grid-template-columns:1fr}.docs .invoice-line{grid-template-columns:1fr 1fr}.docs .invoice-line label:first-child{grid-column:1/-1}.docs .invoice-line button{grid-column:1/-1}.docs{padding:12px}.docs th,.docs td{padding:8px}}
</style>
