<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <style>
        :root {
            --primary: #10b981;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            max-width: 500px;
            padding: 2rem;
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
            position: relative;
            z-index: 2;
        }

        /* ---- Сцена с машиной и дорогой ---- */
        .scene {
            position: relative;
            width: 100%;
            height: 140px;
            margin-bottom: 0.5rem;
            overflow: hidden;
        }

        .road {
            position: absolute;
            bottom: 22px;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(to right,
                    #cbd5e1 0px,
                    #cbd5e1 20px,
                    transparent 20px,
                    transparent 40px);
            animation: roadMove 0.6s linear infinite;
        }

        .car-wrap {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            animation: driveAway 3.2s cubic-bezier(0.55, 0, 0.85, 0.35) infinite;
        }

        .car {
            width: 130px;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 8px rgba(16, 185, 129, 0.25));
            animation: bounce 0.35s ease-in-out infinite;
        }

        .wheel {
            transform-origin: center;
            animation: spin 0.4s linear infinite;
        }

        .smoke {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(148, 163, 184, 0.6);
            animation: smokeOut 3.2s ease-out infinite;
        }

        .smoke:nth-child(2) {
            animation-delay: 0.5s;
        }

        .smoke:nth-child(3) {
            animation-delay: 1s;
        }

        .smoke:nth-child(4) {
            animation-delay: 1.5s;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 0.5rem 0;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -1px;
        }

        p {
            font-size: 1.2rem;
            color: #64748b;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            background-color: #059669;
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes driveAway {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }

            70% {
                transform: translateX(220%) scale(0.55);
                opacity: 1;
            }

            85% {
                transform: translateX(320%) scale(0.35);
                opacity: 0;
            }

            86% {
                transform: translateX(-70%) scale(1);
                opacity: 0;
            }

            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-2px);
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes roadMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: -40px 0;
            }
        }

        @keyframes smokeOut {
            0% {
                opacity: 0;
                transform: translate(-50%, 0) scale(0.4);
            }

            10% {
                opacity: 0.7;
            }

            60% {
                opacity: 0.3;
                transform: translate(-160%, -10px) scale(1.4);
            }

            100% {
                opacity: 0;
                transform: translate(-260%, -14px) scale(1.8);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subtle background pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>
    <div class="container">

        <div class="scene">
            <div class="road"></div>
            <div class="smoke"></div>
            <div class="smoke"></div>
            <div class="smoke"></div>
            <div class="car-wrap">
                <svg class="car" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- кузов -->
                    <path d="M15 68
                 L28 68 L38 45
                 C42 37 50 32 60 32
                 L120 32
                 C130 32 137 36 142 44
                 L158 68
                 L185 68
                 C190 68 193 71 193 76
                 L193 80
                 C193 84 190 87 185 87
                 L15 87
                 C10 87 7 84 7 80
                 L7 76
                 C7 71 10 68 15 68 Z" fill="#10b981" stroke="#059669" stroke-width="2" />
                    <!-- окна -->
                    <path d="M55 43 L65 43 C67 43 68 44 68 46 L68 62 L50 62 Z" fill="#e0f7ef" opacity="0.9" />
                    <path d="M75 43 L115 43 C122 43 128 46 132 52 L138 62 L75 62 Z" fill="#e0f7ef" opacity="0.9" />
                    <!-- дверная линия -->
                    <line x1="72" y1="43" x2="72" y2="62" stroke="#059669" stroke-width="1.5" />
                    <!-- фара -->
                    <circle cx="188" cy="72" r="4" fill="#fef9c3" />
                    <!-- бампер -->
                    <rect x="10" y="72" width="14" height="6" rx="2" fill="#059669" />
                    <!-- колёса -->
                    <g class="wheel" style="transform-origin: 50px 87px;">
                        <circle cx="50" cy="87" r="13" fill="#1e293b" />
                        <circle cx="50" cy="87" r="6" fill="#cbd5e1" />
                        <line x1="50" y1="78" x2="50" y2="96" stroke="#94a3b8" stroke-width="1.5" />
                        <line x1="41" y1="87" x2="59" y2="87" stroke="#94a3b8" stroke-width="1.5" />
                    </g>
                    <g class="wheel" style="transform-origin: 155px 87px;">
                        <circle cx="155" cy="87" r="13" fill="#1e293b" />
                        <circle cx="155" cy="87" r="6" fill="#cbd5e1" />
                        <line x1="155" y1="78" x2="155" y2="96" stroke="#94a3b8" stroke-width="1.5" />
                        <line x1="146" y1="87" x2="164" y2="87" stroke="#94a3b8" stroke-width="1.5" />
                    </g>
                </svg>
            </div>
        </div>

        <h1>Упс... 404</h1>
        <p>Похоже, вы забрели в неизвестность. Такой страницы здесь больше нет или никогда не было.</p>
        <a href="/" class="btn">Вернуться домой</a>
    </div>
</body>

</html>
