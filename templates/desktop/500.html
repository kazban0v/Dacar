<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Внутренняя ошибка сервера | DACAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #EF4444;
            --primary-hover: #DC2626;
            --accent-orange: #F97316;
            --bg: #0B1120;
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
            padding: 1.5rem;
        }

        /* Ambient Glow & Grid Background */
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, rgba(249, 115, 22, 0.05) 50%, transparent 75%);
            filter: blur(50px);
            z-index: 1;
            pointer-events: none;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            max-width: 540px;
            width: 100%;
            padding: 2.5rem 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(239, 68, 68, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeInCard 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 2;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Scene & Animation */
        .scene {
            position: relative;
            width: 100%;
            height: 140px;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .road {
            position: absolute;
            bottom: 16px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .hazard-cone {
            position: absolute;
            bottom: 16px;
            right: 18%;
            width: 24px;
            height: 30px;
        }

        .car-stage {
            position: relative;
            display: inline-block;
            animation: carVibrate 0.12s ease-in-out infinite alternate;
        }

        @keyframes carVibrate {
            0% { transform: translateY(0); }
            100% { transform: translateY(-1.5px); }
        }

        .car-svg {
            width: 170px;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 14px rgba(239, 68, 68, 0.35));
        }

        /* Hazard Blinker Animation */
        .hazard-light {
            animation: hazardBlink 0.6s infinite ease-in-out alternate;
        }

        @keyframes hazardBlink {
            0% { opacity: 0.15; fill: #4B5563; }
            100% { opacity: 1; fill: #F59E0B; filter: drop-shadow(0 0 8px #F59E0B); }
        }

        /* Steam / Smoke from Hood */
        .steam {
            position: absolute;
            top: 24px;
            left: 32px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(2px);
            animation: puffSteam 2s infinite ease-out;
        }

        .steam:nth-child(2) {
            top: 20px;
            left: 38px;
            animation-delay: 0.5s;
        }

        .steam:nth-child(3) {
            top: 26px;
            left: 44px;
            animation-delay: 1.1s;
        }

        @keyframes puffSteam {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.6);
            }
            30% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translate(-20px, -45px) scale(2.2);
            }
        }

        /* Repair Wrench Animation */
        .wrench-icon {
            position: absolute;
            top: 4px;
            right: 28%;
            font-size: 1.4rem;
            color: #F97316;
            animation: wrenchWiggle 1.4s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.5));
        }

        @keyframes wrenchWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-18deg); }
            75% { transform: rotate(18deg); }
        }

        /* Error Badge & Typography */
        .error-code {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #F87171;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.25rem;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        p {
            font-size: 0.98rem;
            color: var(--text-muted);
            margin-bottom: 1.75rem;
            line-height: 1.55;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.6rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: white;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.5);
            background: linear-gradient(135deg, #F87171, #EF4444);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #E2E8F0;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.97);
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.25rem;
            }
            h1 {
                font-size: 1.85rem;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <div class="container">
        <!-- Animation Scene -->
        <div class="scene">
            <div class="road"></div>
            
            <!-- Repair Icon -->
            <div class="wrench-icon">
                <i class="fa-solid fa-wrench"></i>
            </div>

            <!-- Car on Pit Stop -->
            <div class="car-stage">
                <div class="steam"></div>
                <div class="steam"></div>
                <div class="steam"></div>

                <svg class="car-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Body -->
                    <path d="M15 68
                             L28 68 L38 45
                             C42 37 50 32 60 32
                             L120 32
                             C130 32 137 36 142 44
                             L158 68
                             L185 68
                             C190 68 193 71 193 76
                             L193 80
                             C193 84 190 87 185 87
                             L15 87
                             C10 87 7 84 7 80
                             L7 76
                             C7 71 10 68 15 68 Z" fill="#EF4444" stroke="#DC2626" stroke-width="2" />
                    
                    <!-- Open Hood Accent -->
                    <path d="M28 68 L48 38 L38 45 Z" fill="#B91C1C" />

                    <!-- Windows -->
                    <path d="M55 43 L65 43 C67 43 68 44 68 46 L68 62 L50 62 Z" fill="#1E293B" opacity="0.9" />
                    <path d="M75 43 L115 43 C122 43 128 46 132 52 L138 62 L75 62 Z" fill="#1E293B" opacity="0.9" />
                    
                    <!-- Door line -->
                    <line x1="72" y1="43" x2="72" y2="62" stroke="#DC2626" stroke-width="1.5" />
                    
                    <!-- Hazard Blinker Headlights -->
                    <circle cx="188" cy="72" r="4.5" class="hazard-light" />
                    <circle cx="12" cy="72" r="3.5" class="hazard-light" />

                    <!-- Bumper -->
                    <rect x="10" y="72" width="14" height="6" rx="2" fill="#991B1B" />

                    <!-- Wheels (Stationary on Pit-Stop) -->
                    <g style="transform-origin: 50px 87px;">
                        <circle cx="50" cy="87" r="13" fill="#0F172A" stroke="#334155" stroke-width="2" />
                        <circle cx="50" cy="87" r="6" fill="#64748B" />
                    </g>
                    <g style="transform-origin: 155px 87px;">
                        <circle cx="155" cy="87" r="13" fill="#0F172A" stroke="#334155" stroke-width="2" />
                        <circle cx="155" cy="87" r="6" fill="#64748B" />
                    </g>
                </svg>
            </div>
        </div>

        <!-- Badges & Content -->
        <div class="error-code">
            <i class="fa-solid fa-triangle-exclamation"></i> Ошибка 500 • Сбой на сервере
        </div>

        <h1>Сбой в моторе системы</h1>
        <p>На сервере произошла внутренняя неполадка при обработке запроса. Мы уже диагностируем двигатель и устраняем неисправность.</p>

        <!-- Buttons -->
        <div class="btn-group">
            <button type="button" class="btn btn-primary" onclick="window.location.reload()">
                <i class="fa-solid fa-rotate-right"></i> Обновить страницу
            </button>
            <a href="/" class="btn btn-secondary">
                <i class="fa-solid fa-house"></i> На главную
            </a>
        </div>
    </div>
</body>

</html>
